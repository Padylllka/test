<!doctype html>
<meta charset="utf-8">
<title>Player that loads only after Play</title>
<style>
.video-js { position: relative; width: 480px; height: 270px; }
.vjs-big-play-button { position: absolute; inset: 0; width: 480px; height: 270px; }
</style>
<div class="video-js">
  <video width="480" height="270" muted controls></video>
  <button class="vjs-big-play-button" aria-label="播放视频">▶</button>
</div>
<script>
window.playClicks = 0;
const video = document.querySelector('video');
const button = document.querySelector('button');
if (location.search.includes('hidden')) video.style.display = 'none';
button.onclick = () => {
  window.playClicks++;
  video.style.display = '';
  video.src = 'clip.webm';
  button.style.display = 'none';
  video.play();
};
</script>
